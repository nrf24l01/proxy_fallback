name: ci

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: fmt / vet / test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: gofmt
        run: |
          unformatted=$(gofmt -l ./cmd ./internal)
          if [ -n "$unformatted" ]; then
            echo "::error::unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test (race)
        run: go test -race ./...

      - name: build
        run: go build -trimpath ./...

      - name: catalog definitions are valid
        run: go test ./cmd/catalogup/ -run Catalog -v

  image:
    name: image builds (amd64 + arm64)
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: build multi-arch (never pushes from CI)
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          outputs: type=image,name=ghcr.io/${{ github.repository }},push-by-digest=true

      - name: build locally for the smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: srvimit:ci
          cache-from: type=gha

      - name: smoke test the image
        run: |
          docker run --rm srvimit:ci version
          # snapshots ship inside the image: the catalog must be visible as-is
          docker run --rm srvimit:ci list | tail -2
          docker run --rm srvimit:ci compose | head -14