# Declarative catalog of services recorded into snapshots (record-time only).
#
# Every credential below is a throwaway value used by an ephemeral container that
# lives for one recording run and is torn down afterwards. None of them are meant
# to be reused, and none guard real data: the containers start empty, are recorded
# and removed. Replace them if you record on a shared host.
#
# Each entry is started with its own docker compose project, waits until `wait`
# answers, is recorded, and is torn down. `host_port` doubles as the default port
# of the resulting catalog entry (`srvimit serve -service <name>`).


- name: vaultwarden
  title: Vaultwarden
  category: security
  host_port: 8201
  login_path: /
  pages: ["/"]
  api: [/api/config]
  wait: /
  posts:
    - path: /identity/connect/token
      content_type: application/x-www-form-urlencoded
      body: 'grant_type=password&username=admin%40example.com&password=definitely-wrong&scope=api%20offline_access&client_id=web&deviceType=10&deviceIdentifier=veil-verify&deviceName=firefox'
    - path: /identity/connect/token
      content_type: application/json
      body: '{"grant_type":"password","username":"admin@example.com","password":"definitely-wrong","client_id":"web"}'
  compose:
    services:
      app:
        image: vaultwarden/server:latest
        ports: ["127.0.0.1:8201:80"]
        environment:
          SIGNUPS_ALLOWED: "false"
          INVITATIONS_ALLOWED: "false"
          ADMIN_TOKEN: "catalogRecordToken123456"
          DOMAIN: "https://vaultwarden.example.com"
          I_REALLY_WANT_VOLATILE_STORAGE: "true"

