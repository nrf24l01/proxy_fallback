  host_port: 8242
  login_path: /auth/login
  pages: ["/", "/auth/login"]
  api: [/api/server/ping, /api/server/about, /api/server/config, /api/server/version]
  wait: /api/server/ping
  public_url: http://127.0.0.1:8242
  setup:
    - >-
      curl -s -o /dev/null -w "admin-signup:%{http_code}"
      -X POST http://127.0.0.1:{port}/api/auth/admin-signup
      -H "Content-Type: application/json"
      -d '{"email":"admin@example.com","password":"Adm1nPassw0rd1","name":"admin"}'
  posts:
    - path: /api/auth/login
      content_type: application/json
      body: '{"email":"admin@example.com","password":"definitely-wrong"}'
  compose:
    services:
      db:
        image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0
        environment:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: immich
          POSTGRES_INITDB_ARGS: "--data-checksums"
      redis:
        image: valkey/valkey:8
      app:
        image: ghcr.io/immich-app/immich-server:release
        ports: ["127.0.0.1:8242:2283"]
        depends_on: [db, redis]
        environment:
          DB_HOSTNAME: db
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_DATABASE_NAME: immich
          REDIS_HOSTNAME: redis
          IMMICH_MACHINE_LEARNING_ENABLED: "false"
