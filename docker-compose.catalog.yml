# Run the whole recorded catalog: one process, sequential ports.
#
#   docker compose -f docker-compose.catalog.yml up -d
#   curl -sI http://127.0.0.1:8000/login      # first service in the catalog
#   ./bin/srvimit list                        # which service sits on which port
#
# `serve -all -base-port 8000` assigns 8000, 8001, … in catalog order, so the
# published range must cover the number of snapshots you actually have.
services:
  srvimit:
    image: ${IMAGE:-ghcr.io/nrf24l01/proxy_fallback:latest}
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
    container_name: ${CONTAINER_NAME:-srvimit-catalog}
    restart: unless-stopped
    command:
      - serve
      - -all
      - -base-port
      - "${BASE_PORT:-8000}"
      - -listen
      - 0.0.0.0
    volumes:
      - ${FIXTURES_PATH:-./fixtures}:/data/fixtures:ro
    ports:
      # 30 services => 8000-8029; widen the range if you record more.
      - "${BIND_ADDR:-127.0.0.1}:${PORT_RANGE:-8000-8030}:${PORT_RANGE:-8000-8030}"
    healthcheck:
      test: ["CMD", "/usr/local/bin/srvimit", "list", "-fixtures", "/data/fixtures"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp