# Generated by srvimit compose from the snapshots in fixtures.
#
#   docker compose up -d <service>   # start exactly one imitation, e.g.: docker compose up -d grafana
#   docker compose up -d             # start every service in this file
#   docker compose logs -f <service>
#   docker compose down
#
# The published image already contains the snapshots, so no volume mounts are
# needed. Regenerate after re-recording: srvimit compose > docker-compose.yml
name: srvimit

services:
  actual:
    image: ghcr.io/nrf24l01/proxy_fallback:latest
    build:
      context: .
      args:
        VERSION: local
    container_name: srvimit-actual
    restart: unless-stopped
    command: ["serve", "-service", "actual", "-port", "8000", "-listen", "0.0.0.0"]
    ports:
      - "127.0.0.1:8000:8000"
    read_only: true
    tmpfs:
      - /tmp
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8000/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

